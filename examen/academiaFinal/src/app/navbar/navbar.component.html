    <header class="navbar">
        <div class="navbar-brand">
            <span class="logo-icon">🎓</span>
            <h1><a routerLink="/" routerLinkActive="active" class="nav-link">Academia Online</a></h1>
        </div>
        
        <nav class="navbar-menu">
            <a routerLink="/alumnos/nuevo" routerLinkActive="active" class="nav-link active" *ngIf="profesorLogin()!==null">Matricular Alumno</a>
            <a routerLink="/cursos" routerLinkActive="active" class="nav-link" *ngIf="profesorLogin()!==null">Gestionar Cursos</a>
        </nav>

        <div class="navbar-user" *ngIf="profesorLogin()!==null">
            <div class="user-info">
                <span class="label">Profesor:</span>
                <span class="name">{{profesorLogin()?.nombre}}</span>
            </div>
            <button class="btn btn-outline-light btn-sm" (click)="cambiarProfesor()">Cambiar</button>
        </div>
    </header>
