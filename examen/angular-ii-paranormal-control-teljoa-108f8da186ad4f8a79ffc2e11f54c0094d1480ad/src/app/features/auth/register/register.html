<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <div class="panel w-full max-w-md z-10 animate-[fadeIn_0.5s_ease-out]">
    
    <h2 class="text-2xl text-terminal mb-1 text-center">NUEVO RECLUTA</h2>
    <p class="text-xs text-center text-gray-500 font-mono mb-6 uppercase tracking-widest">Formulario de acceso nivel 1</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div>
        <label class="input-label">Correo Institucional</label>
        <input type="email" formControlName="email" class="input-field" placeholder="agente@bureau.com">
      </div>

      <div>
        <label class="input-label">Clave de Acceso</label>
        <input type="password" formControlName="password" class="input-field" placeholder="••••••">
      </div>

      <div>
        <label class="input-label">Nombre en Clave</label>
        <div class="relative">
          <input type="text" formControlName="codeName" class="input-field" placeholder="Ej: Agente K">
        </div>
        
        <!-- TODO: Mostrar error si el nombre en clave ya existe -->
          @if(form.get('codeName')?.hasError('codeNameExists')){
            <span class="text-danger text-xs mt-1 block font-mono">
              ⚠️ ESE NOMBRE EN CLAVE YA ESTÁ ASIGNADO
            </span>
          }
      </div>

      <div>
        <label class="input-label">Departamento Asignado</label>
        <select formControlName="department" class="input-field appearance-none">
          <option value="Investigación">Investigación</option>
          <option value="Contención">Contención</option>
          <option value="Táctico">Táctico</option>
        </select>
      </div>

      <div class="pt-4 flex flex-col gap-3">
        <button type="submit" class="btn btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="form.invalid">
          REGISTRAR NUEVO AGENTE
        </button>
        
        <a routerLink="/auth/login" class="text-xs text-center text-gray-500 hover:text-terminal font-mono cursor-pointer transition-colors">
          // YA TENGO CREDENCIALES
        </a>
      </div>

    </form>
  </div>
</div>
